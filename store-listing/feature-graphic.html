<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FlexRiders Feature Graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<!-- Google Play feature graphic: 1024x500. Render with render.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; position: relative; color: #fff;
    background: radial-gradient(60% 90% at 78% 60%, #1E3A8A 0%, rgba(30,58,138,0) 70%),
                radial-gradient(50% 80% at 0% 0%, #13235c 0%, rgba(19,35,92,0) 70%),
                linear-gradient(120deg, #0B1120 0%, #0A1330 100%); }
  .speed { position: absolute; inset: 0; opacity: .55; background: repeating-linear-gradient(-62deg, transparent 0 46px, rgba(59,130,246,.07) 46px 48px); }
  .logo { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 12px; }
  .logo .mark { width: 54px; height: 54px; border-radius: 15px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .logo .mark img { width: 42px; }
  .logo span { font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
  .logo span b { color: #60A5FA; font-weight: 800; }
  h1 { position: absolute; left: 64px; top: 146px; font-size: 58px; line-height: 1.04; font-weight: 900; letter-spacing: -1.8px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #60A5FA, #2563EB); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; left: 66px; top: 290px; width: 470px; font-size: 19px; line-height: 1.45; color: #B6C3E0; font-weight: 500; }
  .pills { position: absolute; left: 64px; top: 382px; display: flex; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px; background: rgba(59,130,246,.16); border: 1px solid rgba(96,165,250,.35); color: #DBEAFE; font-size: 14.5px; font-weight: 700; }
  .pill ion-icon { color: #60A5FA; font-size: 17px; }
  .ring { position: absolute; right: 70px; top: 40px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,.55), rgba(37,99,235,.15) 60%, rgba(37,99,235,0) 72%); }
  .rider { position: absolute; right: 70px; bottom: -40px; height: 540px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
  .tag { position: absolute; background: #fff; color: #0F172A; border-radius: 16px; padding: 11px 15px; box-shadow: 0 14px 30px rgba(0,0,0,.4); display: flex; align-items: center; gap: 10px; }
  .tag .ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .tag small { display: block; font-size: 12px; color: #64748B; font-weight: 600; }
  .tag b { font-size: 17px; font-weight: 800; }
</style>
</head>
<body>
  <div class="speed"></div>
  <div class="logo"><div class="mark"><img src="assets/logo-mark.png" alt=""></div><span>Flex<b>Riders</b></span></div>
  <h1>Ride. Advertise.<br><em>Earn every day.</em></h1>
  <div class="sub">Join brand campaigns near you, post three quick photos a day and get paid to your UPI.</div>
  <div class="pills">
    <div class="pill"><ion-icon name="map"></ion-icon>Campaigns near you</div>
    <div class="pill"><ion-icon name="camera"></ion-icon>Daily photos</div>
    <div class="pill"><ion-icon name="wallet"></ion-icon>UPI payouts</div>
  </div>
  <div class="ring"></div>
  <img class="rider" src="assets/rider-hero.png" alt="">
  <div class="tag" style="right:372px;top:118px"><div class="ic" style="background:#DCFCE7;color:#16A34A"><ion-icon name="checkmark-circle"></ion-icon></div><div><small>Morning photo</small><b>Approved</b></div></div>
  <div class="tag" style="right:40px;top:300px"><div class="ic" style="background:#EEF3FE;color:#3563E9"><ion-icon name="wallet"></ion-icon></div><div><small>Daily reward</small><b>Paid per day</b></div></div>
</body>
</html>
